# Сервер синхронізації + Caddy (HTTPS із безкоштовним сертифікатом, оновлюється сам).
# Запуск: docker compose --env-file .env up -d --build   (з папки deploy)
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    volumes:
      - /var/lib/gen:/data
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN у deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
